# Local AI prototype only. No DB required. No online gameplay yet.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      UI_PLANS_DIR: /app/data/ui-designs
    volumes:
      - ui-designs:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ui-designs:
