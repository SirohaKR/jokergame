<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>라스트 원 · UI 스튜디오</title><link rel="stylesheet" href="editor/editor.css"></head><body>
<header class="top"><a href="/" class="brand">♧ <span>LAST ONE <small>UI STUDIO</small></span></a><input id="project-name" aria-label="기획안 제목" placeholder="기획안 제목을 입력하세요" maxlength="100"><span id="save-status" role="status">이 브라우저에 자동 저장</span><div class="actions"><button id="undo" title="Ctrl+Z">↶ 실행 취소</button><button id="redo" title="Ctrl+Shift+Z">↷ 다시 실행</button><button id="import">불러오기</button><button id="export">JSON 저장</button><button id="png">PNG 저장</button><button id="save-plan" class="primary">기획에 저장</button></div></header>
<div class="workspace"><aside class="library"><div class="section-head"><span>라이브러리</span><small>끌어 놓거나 클릭</small></div><h2>기본 요소</h2><div id="palette" class="palette"></div><h2>캐릭터 & 에셋</h2><select id="asset-kind" aria-label="에셋 종류"><option value="character">캐릭터 스탠딩</option><option value="skill">스킬 컷인</option><option value="emote">이모티콘 시트</option></select><div id="assets" class="assets"></div><button id="upload" class="wide">＋ 내 이미지 추가</button><h2>레이어 <small>위쪽이 앞에 표시됩니다</small></h2><div id="layers" class="layers"></div></aside>
<main class="main"><nav class="canvas-toolbar"><div id="scenes" class="tabs"></div><div class="view-controls"><label><input type="checkbox" id="snap" checked> 8px 맞춤</label><button id="fit">화면 맞춤</button><select id="zoom" aria-label="확대 비율"><option value="">맞춤</option><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option></select><button id="preview">미리보기</button></div></nav><div class="canvas-scroll" id="viewport"><div id="stage-wrap"><div id="stage" tabindex="0" aria-label="UI 배치 편집 영역"></div></div></div><footer class="hint"><span>드래그로 이동 · 모서리로 크기 조절 · 방향키로 미세 이동 · Delete로 삭제</span><span id="dimensions"></span></footer><div class="handoff"><span>제목을 입력하고 <b>기획에 저장</b>을 누르면 세 화면과 메모가 보관됩니다.</span> <a href="/ui-plans.html">UI 디자인 기획 보기 ↗</a> <a id="saved-plan" hidden>방금 저장한 와이어프레임 보기 ↗</a></div></main>
<aside class="inspector"><div class="section-head">속성 <span id="selection-name">화면</span></div><div id="properties"></div><div class="screen-settings"><h2>화면 설정</h2><label>캔버스 크기<select id="preset"><option value="1280,720">PC · 1280 × 720</option><option value="1920,1080">PC · 1920 × 1080</option><option value="390,844">모바일 · 390 × 844</option><option value="custom">직접 입력</option></select></label><div class="two"><label>가로<input id="canvas-width" type="number" min="320" max="3840"></label><label>세로<input id="canvas-height" type="number" min="320" max="3840"></label></div><label>배경색<input id="canvas-color" type="color"></label><label>수정 의도 / 전달 메모<textarea id="notes" rows="4" maxlength="4000" placeholder="예: 대전 버튼을 더 크게, 캐릭터는 왼쪽으로"></textarea></label><p class="muted">화면 크기를 바꿔도 요소 좌표는 유지됩니다.</p><button id="reset" class="wide">이 화면을 기본 배치로 되돌리기</button></div></aside></div>
<input id="json-file" type="file" accept=".json,application/json" hidden><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><div id="toast" role="status" aria-live="polite"></div><script type="module" src="editor/editor.js"></script></body></html>
