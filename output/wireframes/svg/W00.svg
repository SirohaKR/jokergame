<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><title>화면 흐름 · 시점 분리</title><rect x="0" y="0" width="1600" height="1080" rx="8" fill="#E5EAF0" stroke="none" stroke-width="2"/><text x="40" y="55" font-family="Malgun Gothic" font-size="30" font-weight="700" fill="#253142">W00  /  화면 흐름 · 시점 분리</text><text x="40" y="90" font-family="Malgun Gothic" font-size="18" font-weight="400" fill="#647184">도둑잡기 · PC 가로형 · 와이어프레임 v0.7</text><rect x="1300" y="28" width="210" height="36" rx="5" fill="#EAF2FA" stroke="none" stroke-width="2"/><text x="1312" y="52" font-family="Malgun Gothic" font-size="18" font-weight="700" fill="#315E89">핵심 화면</text><rect x="40" y="110" width="1520" height="855" rx="12" fill="#FFFFFF" stroke="#BDC6D0" stroke-width="2"/><text x="60" y="1007" font-family="Malgun Gothic" font-size="18" font-weight="400" fill="#253142">화면 ID는 이후 상세 기획서와 Swagger/OpenAPI 명세에 연결할 기준입니다.</text><text x="60" y="1038" font-family="Malgun Gothic" font-size="18" font-weight="400" fill="#647184">구현 범위: 와이어프레임만 · 서버: 시놀로지 NAS 예정 / 프론트·백 분리 / 상세 DB 설계는 다음 단계</text><text x="95" y="175" font-family="Malgun Gothic" font-size="30" font-weight="700" fill="#253142">한 세트의 흐름</text><rect x="100" y="210" width="280" height="95" rx="8" fill="#EAF2FA" stroke="#315E89" stroke-width="2"/><text x="120" y="243" font-family="Malgun Gothic" font-size="18" font-weight="700" fill="#315E89">W01</text><text x="120" y="280" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#253142">메인</text><text x="393" y="265" font-family="Malgun Gothic" font-size="27" font-weight="400" fill="#315E89">→</text><rect x="440" y="210" width="280" height="95" rx="8" fill="#EAF2FA" stroke="#315E89" stroke-width="2"/><text x="460" y="243" font-family="Malgun Gothic" font-size="18" font-weight="700" fill="#315E89">W02</text><text x="460" y="280" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#253142">대기실</text><text x="733" y="265" font-family="Malgun Gothic" font-size="27" font-weight="400" fill="#315E89">→</text><rect x="780" y="210" width="280" height="95" rx="8" fill="#EAF2FA" stroke="#315E89" stroke-width="2"/><text x="800" y="243" font-family="Malgun Gothic" font-size="18" font-weight="700" fill="#315E89">W03</text><text x="800" y="280" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#253142">내 차례</text><text x="1073" y="265" font-family="Malgun Gothic" font-size="27" font-weight="400" fill="#315E89">→</text><rect x="1120" y="210" width="280" height="95" rx="8" fill="#EAF2FA" stroke="#315E89" stroke-width="2"/><text x="1140" y="243" font-family="Malgun Gothic" font-size="18" font-weight="700" fill="#315E89">W04</text><text x="1140" y="280" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#253142">카드 선택</text><line x1="1250" y1="305" x2="1250" y2="350" stroke="#315E89" stroke-width="3"/><text x="100" y="372" font-family="Malgun Gothic" font-size="27" font-weight="700" fill="#253142">동일 사건 · 서로 다른 화면</text><rect x="100" y="405" width="420" height="155" rx="8" fill="#F1F4F7" stroke="#BDC6D0" stroke-width="2"/><text x="120" y="449" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#253142">W04  A · 뽑는 사람</text><text x="120" y="500" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#647184">카드 뒷면 / 선택 / 확정</text><rect x="570" y="405" width="420" height="155" rx="8" fill="#F1F4F7" stroke="#BDC6D0" stroke-width="2"/><text x="590" y="449" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#253142">W05  B · 뽑히는 사람</text><text x="590" y="500" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#647184">카드 앞면 / 상대 손 이동</text><rect x="1040" y="405" width="420" height="155" rx="8" fill="#F1F4F7" stroke="#BDC6D0" stroke-width="2"/><text x="1060" y="449" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#253142">W08  C·D · 대기</text><text x="1060" y="500" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#647184">테이블 / 자기 손패만</text><rect x="100" y="595" width="890" height="90" rx="8" fill="#EAF2FA" stroke="#315E89" stroke-width="2"/><text x="125" y="639" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#253142">A·B만 W06 일반 카드 / W07 조커 결과 확인</text><rect x="1040" y="595" width="420" height="90" rx="8" fill="#F1F4F7" stroke="#BDC6D0" stroke-width="2"/><text x="1060" y="645" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#253142">C·D는 W08 유지</text><text x="100" y="750" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#253142">W09 페어 정리 → 다음 턴 / W10 내 승리 후 대기 → W11 세트 결과</text><text x="100" y="807" font-family="Malgun Gothic" font-size="22" font-weight="400" fill="#647184">예외: B가 A의 마지막 카드를 뽑으면 A의 종료를 먼저 확정합니다.</text><line x1="100" y1="840" x2="1460" y2="840" stroke="#BDC6D0" stroke-width="2"/><text x="100" y="893" font-family="Malgun Gothic" font-size="23" font-weight="700" fill="#315E89">후속 화면  W13 스킬  ·  W14 매치 최종 정산  ·  W15 캐릭터 / 상점</text></svg>